<!doctype html><html><body><template><style>@font-face{font-family:Estate;src:url('assets/fonts/cormorant.ttf')}@font-face{font-family:Sans;src:url('assets/fonts/font-2.woff2');font-weight:400}@font-face{font-family:Sans;src:url('assets/fonts/font-3.woff2');font-weight:700}#captions{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.caption{position:absolute;inset:auto 170px 88px 170px;height:92px;display:flex;align-items:center;justify-content:center;color:#f4efe4;font:34px/1.25 Sans,sans-serif;text-align:center}.caption span{background:#142c25;border-left:3px solid #d9be84;padding:12px 24px;max-width:1500px;box-shadow:0 12px 32px rgba(0,0,0,0.4)}</style><div data-hf-id="hf-mcjh" id="captions" data-composition-id="captions" data-duration="150" data-width="1920" data-height="1080"><div data-hf-id="hf-sgwg" id="caption-0" class="clip caption" data-start="3" data-duration="2.24" data-track-index="6"><span data-hf-id="hf-caxg">At first, it&#x27;s the light.</span></div><div data-hf-id="hf-bygi" id="caption-1" class="clip caption" data-start="5.56" data-duration="1.76" data-track-index="6"><span data-hf-id="hf-9zt9">Then the ocean air,</span></div><div data-hf-id="hf-ni7q" id="caption-2" class="clip caption" data-start="7.36" data-duration="2.12" data-track-index="6"><span data-hf-id="hf-od3q">the coffee, and the feeling that your</span></div><div data-hf-id="hf-02pv" id="caption-3" class="clip caption" data-start="9.64" data-duration="1.76" data-track-index="6"><span data-hf-id="hf-unel">day belongs to you.</span></div><div data-hf-id="hf-7fsk" id="caption-4" class="clip caption" data-start="11.72" data-duration="1.32" data-track-index="6"><span data-hf-id="hf-oajk">You walk outside.</span></div><div data-hf-id="hf-niw7" id="caption-5" class="clip caption" data-start="13.32" data-duration="1.36" data-track-index="6"><span data-hf-id="hf-26lp">Someone knows your name.</span></div><div data-hf-id="hf-kkac" id="caption-6" class="clip caption" data-start="14.92" data-duration="1.28" data-track-index="6"><span data-hf-id="hf-q3c4">Around the next table,</span></div><div data-hf-id="hf-1k1i" id="caption-7" class="clip caption" data-start="16.28" data-duration="1.48" data-track-index="6"><span data-hf-id="hf-qe9s">there&#x27;s room for one more.</span></div><div data-hf-id="hf-o1qq" id="caption-8" class="clip caption" data-start="18.04" data-duration="1.92" data-track-index="6"><span data-hf-id="hf-1uiu">Imagine belonging here.</span></div><div data-hf-id="hf-k1rp" id="caption-9" class="clip caption" data-start="30.08" data-duration="1.92" data-track-index="6"><span data-hf-id="hf-f1s8">Now look at the land behind that</span></div><div data-hf-id="hf-qwrw" id="caption-10" class="clip caption" data-start="32.08" data-duration="3.28" data-track-index="6"><span data-hf-id="hf-nkfu">feeling. Rising from the hills above Brasilito</span></div><div data-hf-id="hf-9u2p" id="caption-11" class="clip caption" data-start="35.44" data-duration="1.36" data-track-index="6"><span data-hf-id="hf-0n6a">toward the Pacific,</span></div><div data-hf-id="hf-jto6" id="caption-12" class="clip caption" data-start="36.88" data-duration="2.56" data-track-index="6"><span data-hf-id="hf-nwsc">Eden Mazara spans nearly nine hundred and</span></div><div data-hf-id="hf-tv7p" id="caption-13" class="clip caption" data-start="39.52" data-duration="3.04" data-track-index="6"><span data-hf-id="hf-z9gx">fifty acres on Costa Rica&#x27;s Gold Coast.</span></div><div data-hf-id="hf-ss6f" id="caption-14" class="clip caption" data-start="42.64" data-duration="1.2" data-track-index="6"><span data-hf-id="hf-lw3b">Room for homes,</span></div><div data-hf-id="hf-0gxk" id="caption-15" class="clip caption" data-start="43.88" data-duration="2.04" data-track-index="6"><span data-hf-id="hf-ogpj">gathering places, and wild,</span></div><div data-hf-id="hf-pygz" id="caption-16" class="clip caption" data-start="46" data-duration="1.84" data-track-index="6"><span data-hf-id="hf-i8e0">open nature between them.</span></div><div data-hf-id="hf-edun" id="caption-17" class="clip caption" data-start="47.92" data-duration="1.36" data-track-index="6"><span data-hf-id="hf-ku6a">A generous vision,</span></div><div data-hf-id="hf-wzhw" id="caption-18" class="clip caption" data-start="49.44" data-duration="1.28" data-track-index="6"><span data-hf-id="hf-gn8r">grounded in a disciplined</span></div><div data-hf-id="hf-9hnq" id="caption-19" class="clip caption" data-start="50.88" data-duration="2.918" data-track-index="6"><span data-hf-id="hf-gy9r">nine-million-dollar contracted land basis.</span></div><div data-hf-id="hf-zvlc" id="caption-20" class="clip caption" data-start="60.08" data-duration="3.28" data-track-index="6"><span data-hf-id="hf-x3q6">Every lasting place begins with people.</span></div><div data-hf-id="hf-pjxr" id="caption-21" class="clip caption" data-start="63.44" data-duration="2.48" data-track-index="6"><span data-hf-id="hf-1ljd">Shared tables, long lunches,</span></div><div data-hf-id="hf-h165" id="caption-22" class="clip caption" data-start="66.08" data-duration="1.12" data-track-index="6"><span data-hf-id="hf-v7gx">hands in the earth,</span></div><div data-hf-id="hf-oao2" id="caption-23" class="clip caption" data-start="67.28" data-duration="2.56" data-track-index="6"><span data-hf-id="hf-eyrj">and stories that bring you closer.</span></div><div data-hf-id="hf-a6qx" id="caption-24" class="clip caption" data-start="69.92" data-duration="2.64" data-track-index="6"><span data-hf-id="hf-hwgg">That life takes root at El Encanto:</span></div><div data-hf-id="hf-10l3" id="caption-25" class="clip caption" data-start="72.64" data-duration="2.8" data-track-index="6"><span data-hf-id="hf-nqwo">the proposed first residential release of forty</span></div><div data-hf-id="hf-ya32" id="caption-26" class="clip caption" data-start="75.52" data-duration="2.8" data-track-index="6"><span data-hf-id="hf-ocx1">titled homesites along the coastal ridges.</span></div><div data-hf-id="hf-xq5l" id="caption-27" class="clip caption" data-start="78.52" data-duration="1.053" data-track-index="6"><span data-hf-id="hf-7ej1">Beyond your door,</span></div><div data-hf-id="hf-t1s2" id="caption-28" class="clip caption" data-start="79.627" data-duration="2.853" data-track-index="6"><span data-hf-id="hf-88lx">the sanctuary opens into ocean surf,</span></div><div data-hf-id="hf-q8t7" id="caption-29" class="clip caption" data-start="82.56" data-duration="2.48" data-track-index="6"><span data-hf-id="hf-jwst">movement, and restoration.</span></div><div data-hf-id="hf-h23w" id="caption-30" class="clip caption" data-start="85.12" data-duration="4.48" data-track-index="6"><span data-hf-id="hf-klkf">Move. Breathe. Live well, together.</span></div><div data-hf-id="hf-nzmt" id="caption-31" class="clip caption" data-start="95.08" data-duration="1.36" data-track-index="6"><span data-hf-id="hf-j04i">And there has to be room to</span></div><div data-hf-id="hf-xdix" id="caption-32" class="clip caption" data-start="96.52" data-duration="2.56" data-track-index="6"><span data-hf-id="hf-g3s1">slow down. Quiet mornings,</span></div><div data-hf-id="hf-ue0v" id="caption-33" class="clip caption" data-start="99.16" data-duration="2.56" data-track-index="6"><span data-hf-id="hf-3q3h">thermal waters, and care for the ground</span></div><div data-hf-id="hf-we8v" id="caption-34" class="clip caption" data-start="101.8" data-duration="1.28" data-track-index="6"><span data-hf-id="hf-vfl5">beneath your feet.</span></div><div data-hf-id="hf-11rl" id="caption-35" class="clip caption" data-start="103.16" data-duration="2.32" data-track-index="6"><span data-hf-id="hf-rsys">Because a sanctuary is only as real</span></div><div data-hf-id="hf-u08s" id="caption-36" class="clip caption" data-start="105.6" data-duration="1.56" data-track-index="6"><span data-hf-id="hf-otrc">as what sustains it.</span></div><div data-hf-id="hf-yp5a" id="caption-37" class="clip caption" data-start="107.24" data-duration="1.413" data-track-index="6"><span data-hf-id="hf-yvix">Beneath these hills,</span></div><div data-hf-id="hf-d51c" id="caption-38" class="clip caption" data-start="108.787" data-duration="2.986" data-track-index="6"><span data-hf-id="hf-7rva">project materials identify nine production wells,</span></div><div data-hf-id="hf-6c0t" id="caption-39" class="clip caption" data-start="111.827" data-duration="2.613" data-track-index="6"><span data-hf-id="hf-msqh">with reported combined flow above fifty liters</span></div><div data-hf-id="hf-r4ge" id="caption-40" class="clip caption" data-start="114.52" data-duration="2" data-track-index="6"><span data-hf-id="hf-2v0h">per second. Real land,</span></div><div data-hf-id="hf-fshi" id="caption-41" class="clip caption" data-start="116.6" data-duration="1.92" data-track-index="6"><span data-hf-id="hf-rfyu">real water, advancing through</span></div><div data-hf-id="hf-ukcq" id="caption-42" class="clip caption" data-start="118.627" data-duration="2.495" data-track-index="6"><span data-hf-id="hf-qthy">diligence phase by phase.</span></div><div data-hf-id="hf-foyo" id="caption-43" class="clip caption" data-start="125.08" data-duration="2.8" data-track-index="6"><span data-hf-id="hf-c9ny">Then the afternoon turns to gold.</span></div><div data-hf-id="hf-qap7" id="caption-44" class="clip caption" data-start="127.96" data-duration="1.68" data-track-index="6"><span data-hf-id="hf-1ua8">From the surf at Witch&#x27;s Rock to</span></div><div data-hf-id="hf-2fhk" id="caption-45" class="clip caption" data-start="129.72" data-duration="2.16" data-track-index="6"><span data-hf-id="hf-tkfo">a hundred and eighty meters of beachfront</span></div><div data-hf-id="hf-543p" id="caption-46" class="clip caption" data-start="132" data-duration="2.2" data-track-index="6"><span data-hf-id="hf-pxqu">concession at Playa Brasilito,</span></div><div data-hf-id="hf-pinx" id="caption-47" class="clip caption" data-start="134.28" data-duration="2.32" data-track-index="6"><span data-hf-id="hf-yat8">you find your people by the water.</span></div><div data-hf-id="hf-rubj" id="caption-48" class="clip caption" data-start="136.737" data-duration="1.783" data-track-index="6"><span data-hf-id="hf-jlwk">And the question changes:</span></div><div data-hf-id="hf-qc1j" id="caption-49" class="clip caption" data-start="138.6" data-duration="1.44" data-track-index="6"><span data-hf-id="hf-rbij">Could I belong here?</span></div><div data-hf-id="hf-lsqi" id="caption-50" class="clip caption" data-start="140.12" data-duration="1.76" data-track-index="6"><span data-hf-id="hf-lld9">Could I help build this?</span></div><div data-hf-id="hf-fhad" id="caption-51" class="clip caption" data-start="141.96" data-duration="3.2" data-track-index="6"><span data-hf-id="hf-hoyi">Eden Mazara invites aligned acquisition and development</span></div><div data-hf-id="hf-hlen" id="caption-52" class="clip caption" data-start="145.44" data-duration="2.078" data-track-index="6"><span data-hf-id="hf-t1hc">partners to shape what comes next.</span></div></div><script>{const tl=gsap.timeline({paused:true});window.__timelines["captions"]=tl;}</script></template></body></html>
